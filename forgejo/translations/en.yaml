---
configuration:
  app_name:
    name: "App Name"
    description: "Display name of the Forgejo instance (appears in browser tab and header)."

  domain:
    name: "Domain / Hostname"
    description: >-
      Hostname or IP you use to open Forgejo (e.g. 'git.home.example.com' or '192.0.2.10').
      Used for links and clone URLs. If empty, Forgejo assumes 'localhost' and the log shows a warning.

  ssl:
    name: "Enable HTTPS"
    description: >-
      Enables HTTPS for direct access. Requires 'domain' and valid
      certificate files in the HA SSL directory (/ssl/).
      Not needed for Ingress — HA handles SSL itself.

  certfile:
    name: "SSL Certificate"
    description: "Filename of the SSL certificate from /ssl/ (e.g. 'fullchain.pem')."

  keyfile:
    name: "SSL Private Key"
    description: "Filename of the SSL private key from /ssl/ (e.g. 'privkey.pem')."

  ssh_enabled:
    name: "Enable SSH Git Access"
    description: >-
      Allows Git access via SSH (git clone/push/pull over ssh://).
      Port 22/tcp must be mapped in the add-on's network settings.

  ssh_port:
    name: "SSH Port"
    description: "External SSH port for Git operations (default: 22)."

  log_level:
    name: "Log Level"
    description: >-
      Logging verbosity. 'Info' for normal operation,
      'Debug' or 'Trace' for troubleshooting (very verbose).

network:
  3000/tcp:
    name: "Web UI Port"
    description: "Direct HTTP access. Prefer Ingress — this port is optional."
  22/tcp:
    name: "SSH Git Port"
    description: "Only needed if 'Enable SSH Git Access' is on."
