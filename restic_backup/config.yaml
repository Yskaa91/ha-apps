---
name: Restic Backup
description: >-
  Scheduled restic backups of HA config/media/addon data with ntfy alerting on
  failure
url: https://github.com/pol4rfuchs/ha-apps
version: "0.2.1"
slug: restic_backup
image: ghcr.io/pol4rfuchs/restic_backup
init: false
panel_icon: mdi:archive-lock-outline
arch:
  - amd64
  - aarch64
map:
  - homeassistant_config:ro
  - addon_configs:ro
  - media:ro
  - share:rw
  - ssl:ro
options:
  log_level: info
  cron_schedule: 0 3 * * *
  repository: /share/restic-backup/repo
  restic_password: ''
  backup_paths:
    - /homeassistant
    - /addon_configs
    - /ssl
  exclude_patterns:
    - '*.log'
    - '**/__pycache__'
  retention_daily: 7
  retention_weekly: 4
  retention_monthly: 6
  run_on_start: false
  aws_access_key_id: ''
  aws_secret_access_key: ''
  aws_default_region: ''
  ntfy_url: ''
  ntfy_topic: ''
  ntfy_username: ''
  ntfy_password: ''
schema:
  log_level: list(trace|debug|info|notice|warning|error|fatal)
  cron_schedule: str
  repository: str
  restic_password: password
  backup_paths:
    - str
  exclude_patterns:
    - str
  retention_daily: int(0,)
  retention_weekly: int(0,)
  retention_monthly: int(0,)
  run_on_start: bool
  aws_access_key_id: str?
  aws_secret_access_key: password?
  aws_default_region: str?
  ntfy_url: str?
  ntfy_topic: str?
  ntfy_username: str?
  ntfy_password: password?
startup: application
apparmor: true
