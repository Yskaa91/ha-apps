---
name: "Vaultwarden"
version: "0.1.0"
slug: "vaultwarden"
description: "Vaultwarden – schlanker, Bitwarden-kompatibler Passwortmanager-Server"
url: "https://github.com/pol4rfuchs/ha-apps"
arch:
  - aarch64
  - amd64
image: "ghcr.io/pol4rfuchs/vaultwarden"
stage: experimental
init: false
ports:
  7277/tcp: 7277
ports_description:
  7277/tcp: "Vaultwarden (Web Vault, API, WebSocket)"
webui: "[PROTO:ssl]://[HOST]:[PORT:7277]"
watchdog: "[PROTO:ssl]://[HOST]:[PORT:7277]/alive"
map:
  - type: ssl
tmpfs: true
timeout: 30
backup: cold
backup_exclude:
  - "**/icon_cache"
apparmor: true

options:
  log_level: "info"
  ssl: false
  certfile: "fullchain.pem"
  keyfile: "privkey.pem"
  signups_allowed: true
  signups_verify: false
  invitations_allowed: true
  email_change_allowed: true
  emergency_access_allowed: true
  sends_allowed: true
  password_hints_allowed: true
  show_password_hint: false
  enable_websocket: true
  ip_header: "X-Real-IP"
  icon_service: "internal"
  disable_icon_download: false
  http_request_block_non_global_ips: true
  login_ratelimit_seconds: 60
  login_ratelimit_max_burst: 10
  admin_ratelimit_seconds: 300
  admin_ratelimit_max_burst: 3
  unauthenticated_ratelimit_seconds: 60
  unauthenticated_ratelimit_max_burst: 50
  smtp_security: "starttls"
  smtp_accept_invalid_certs: false
  smtp_accept_invalid_hostnames: false
  smtp_debug: false
  push_enabled: false
  push_region: "us"
  sso_enabled: false
  sso_only: false
  sso_signups_allowed: true
  sso_signups_match_email: true
  sso_allow_unknown_email_verification: false
  sso_pkce: true
  domain: ""
  admin_token: ""
  signups_domains_whitelist: ""
  org_creation_users: ""
  ip_header_trusted_proxies: ""
  smtp_host: ""
  smtp_from: ""
  smtp_from_name: ""
  smtp_username: ""
  smtp_password: ""
  smtp_auth_mechanism: ""
  push_installation_id: ""
  push_installation_key: ""
  sso_authority: ""
  sso_client_id: ""
  sso_client_secret: ""
  sso_scopes: ""
  sso_authorize_extra_params: ""
  yubico_client_id: ""
  yubico_secret_key: ""
  duo_ikey: ""
  duo_skey: ""
  duo_host: ""
  hibp_api_key: ""
  experimental_client_feature_flags: ""
  trash_auto_delete_days: 0
  smtp_port: 0
  extra_env: []
schema:
  log_level: "list(trace|debug|info|warning|error)"
  domain: "str?"
  ssl: "bool"
  certfile: "str"
  keyfile: "str"
  admin_token: "password?"
  signups_allowed: "bool"
  signups_verify: "bool"
  signups_domains_whitelist: "str?"
  invitations_allowed: "bool"
  org_creation_users: "str?"
  email_change_allowed: "bool"
  emergency_access_allowed: "bool"
  sends_allowed: "bool"
  password_hints_allowed: "bool"
  show_password_hint: "bool"
  trash_auto_delete_days: "int(0,)"
  enable_websocket: "bool"
  ip_header: "list(X-Real-IP|X-Forwarded-For|none)"
  ip_header_trusted_proxies: "str?"
  icon_service: "list(internal|bitwarden)"
  disable_icon_download: "bool"
  http_request_block_non_global_ips: "bool"
  login_ratelimit_seconds: "int(1,)"
  login_ratelimit_max_burst: "int(2,)"
  admin_ratelimit_seconds: "int(1,)"
  admin_ratelimit_max_burst: "int(1,)"
  unauthenticated_ratelimit_seconds: "int(1,)"
  unauthenticated_ratelimit_max_burst: "int(1,)"
  smtp_host: "str?"
  smtp_port: "int(0,65535)"
  smtp_security: "list(starttls|force_tls|off)"
  smtp_from: "str?"
  smtp_from_name: "str?"
  smtp_username: "str?"
  smtp_password: "password?"
  smtp_auth_mechanism: "str?"
  smtp_accept_invalid_certs: "bool"
  smtp_accept_invalid_hostnames: "bool"
  smtp_debug: "bool"
  push_enabled: "bool"
  push_region: "list(us|eu)"
  push_installation_id: "str?"
  push_installation_key: "password?"
  sso_enabled: "bool"
  sso_only: "bool"
  sso_signups_allowed: "bool"
  sso_signups_match_email: "bool"
  sso_allow_unknown_email_verification: "bool"
  sso_authority: "str?"
  sso_client_id: "str?"
  sso_client_secret: "password?"
  sso_scopes: "str?"
  sso_pkce: "bool"
  sso_authorize_extra_params: "str?"
  yubico_client_id: "str?"
  yubico_secret_key: "password?"
  duo_ikey: "str?"
  duo_skey: "password?"
  duo_host: "str?"
  hibp_api_key: "password?"
  experimental_client_feature_flags: "str?"
  extra_env:
    - name: "match(^[A-Z][A-Z0-9_]*$)"
      value: "str"
