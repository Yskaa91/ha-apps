---
name: SearXNG
version: "1.0.35"
slug: searxng
image: ghcr.io/pol4rfuchs/searxng
description: Privacy-respecting metasearch engine — kein Tracking, keine Profile.
url: https://github.com/pol4rfuchs/ha-apps
arch:
  - aarch64
  - amd64
init: false
ingress: true
ingress_port: 8080
panel_icon: mdi:magnify
apparmor: false
ports:
  8080/tcp: 8080
ports_description:
  8080/tcp: SearXNG Web UI
map:
  - type: addon_config
    read_only: false
    path: /etc/searxng
options:
  set_base_url_for_ingress: true
  log_level: info
schema:
  set_base_url_for_ingress: bool
  log_level: list(debug|info|warning|error)
