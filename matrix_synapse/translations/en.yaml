---
configuration:
  server_name:
    name: Server Name
    description: "Matrix server name / domain (e.g. example.org). This becomes your Matrix ID: @user:server_name."
  element_web_url:
    name: Element Web URL
    description: "External HTTPS URL for Element Web (e.g. https://element.example.org)."
  enable_registration:
    name: Enable Registration
    description: "Allow new users to register accounts on this server."
  registration_shared_secret:
    name: Registration Shared Secret
    description: "Secret for admin-controlled user registration. Leave empty to auto-generate."
  enable_federation:
    name: Enable Federation
    description: "Connect to the wider Matrix network. Disable for fully private servers."
  max_upload_size_mb:
    name: Max Upload Size (MB)
    description: "Maximum file upload size in megabytes (10–500)."
  enable_synapse_admin:
    name: Enable Synapse Admin UI
    description: "Start the Synapse Admin web UI on port 8090."
  postgres_password:
    name: PostgreSQL Password
    description: "Password for the internal Synapse database user."
  log_level:
    name: Log Level
    description: "Synapse log verbosity. WARNING recommended for normal operation."
  ntfy_url:
    name: ntfy URL (UnifiedPush)
    description: "Optional: External URL of your ntfy server (e.g. https://ntfy.deine-domain.tld). Used at startup to verify the ntfy Matrix Push Gateway is reachable and to print setup instructions. Synapse itself does not need this URL — the UnifiedPush client (Element Android) registers the gateway with Synapse automatically."
  enable_voice_calls:
    name: Enable Voice/Video Calls
    description: "Enable Element Call (MSC3401) with LiveKit SFU. Downloads LiveKit and lk-jwt-service on first start."
  livekit_turn_enabled:
    name: Enable internal LiveKit TURN server
    description: "Off by default: calls use direct SFU UDP ports (30000-30020), which is more reliable on normal home/mobile networks. Only enable this if you're on a very restrictive network that only allows HTTPS/port 443 (the internal TURN server then uses that fallback path)."
  livekit_secret:
    name: LiveKit Secret
    description: "Shared secret for LiveKit. Leave empty to auto-generate on first start."
  element_call_url:
    name: Element Call URL
    description: "External HTTPS URL for the Element Call web app."
  livekit_url:
    name: LiveKit URL
    description: "External WSS URL for the LiveKit SFU (e.g. wss://livekit.deine-domain.tld)."
  livekit_jwt_url:
    name: LiveKit JWT URL
    description: "External HTTPS URL for the lk-jwt-service token bridge."
  admin_ui_username:
    name: Admin UI Username
    description: "Basic-Auth username for the Ketesa (Admin UI) on port 8090. Protects the admin interface at the network level."
  admin_ui_password:
    name: Admin UI Password
    description: "Basic-Auth password for the Ketesa (Admin UI). Leave empty to auto-generate on first start (stored in /data/matrix/.admin_ui_auth, never logged)."
  mas_enabled:
    name: Enable MAS Delegation
    description: "Delegates login/registration entirely to the matrix-auth-service add-on (required for Element X QR-code login). Disables native Synapse auth."
  mas_endpoint:
    name: MAS Endpoint
    description: "Internally reachable URL of the matrix-auth-service add-on (e.g. http://homeassistant.local:8082)."
  mas_secret:
    name: MAS Shared Secret
    description: "Must exactly match the value generated/set in the matrix-auth-service add-on."
  whatsapp_bridge_enabled:
    name: Enable WhatsApp Bridge
    description: "Registers the mautrix-whatsapp bridge's appservice with Synapse (requires the WhatsApp Bridge add-on running with its registration.yaml present in /share)."
  signal_bridge_enabled:
    name: Enable Signal Bridge
    description: "Registers the mautrix-signal bridge's appservice with Synapse (requires the Signal Bridge add-on running with its registration.yaml present in /share)."
  telegram_bridge_enabled:
    name: Enable Telegram Bridge
    description: "Registers the mautrix-telegram bridge's appservice with Synapse (requires the Telegram Bridge add-on running with its registration.yaml present in /share)."
  media_retention_local_days:
    name: Media Retention — Local (days)
    description: "Auto-purge locally uploaded media older than this many days. 0 = disabled (keep forever)."
  media_retention_remote_days:
    name: Media Retention — Remote (days)
    description: "Auto-purge cached remote (federated) media older than this many days. 0 = disabled (keep forever). 30 is a sensible default."
  backup_enabled:
    name: Enable Automatic PostgreSQL Backups
    description: "Periodically dump the Synapse database via pg_dump to /data/matrix/backups/ (consistent, unlike raw filesystem snapshots)."
  backup_interval_hours:
    name: Backup Interval (hours)
    description: "How often to run the pg_dump backup job."
  backup_retention_days:
    name: Backup Retention (days)
    description: "How many days of backups to keep before rotating out old dumps."
  login_rate_limit_per_second:
    name: Login Rate Limit (per second)
    description: "Sustained allowed login attempts per second, per address/account (Synapse rc_login). Synapse default is 0.17."
  login_rate_limit_burst:
    name: Login Rate Limit (burst)
    description: "Burst allowance for login attempts before rate limiting kicks in."
  registration_rate_limit_per_second:
    name: Registration Rate Limit (per second)
    description: "Sustained allowed registration attempts per second (Synapse rc_registration). Only relevant if enable_registration is true."
  registration_rate_limit_burst:
    name: Registration Rate Limit (burst)
    description: "Burst allowance for registration attempts before rate limiting kicks in."
