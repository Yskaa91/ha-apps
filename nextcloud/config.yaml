---
name: Nextcloud
description: >-
  A safe home for all your data — full Nextcloud instance with unrestricted app
  store access
version: "33.0.20"
slug: nextcloud
url: https://github.com/yskaa91/ha-apps
image: ghcr.io/yskaa91/nextcloud
init: false
arch:
  - aarch64
  - amd64
map:
  - data:rw
ports:
  80/tcp: 8280
ports_description:
  80/tcp: Nextcloud Web UI
webui: http://[HOST]:[PORT:80]
options:
  admin_user: admin
  admin_password: changeme
  trusted_domains: 'homeassistant.local homeassistant'
  db_type: mysql
  db_host: core-mariadb
  db_port: 3306
  db_name: nextcloud
  db_user: nextcloud
  db_password: ''
  php_memory_limit: 512M
  max_upload_size: 16G
  max_execution_time: 3600
  log_level: info
schema:
  admin_user: str
  admin_password: password
  trusted_domains: str
  db_type: list(sqlite|mysql|pgsql)
  db_host: str
  db_port: int
  db_name: str
  db_user: str
  db_password: password
  php_memory_limit: str
  max_upload_size: str
  max_execution_time: int
  log_level: list(debug|info|warning|error|fatal)
apparmor: false
