name: 19 Version Badges Sync
on:
  push:
    branches:
      - main
    paths:
      - "*/Dockerfile"
      - "*/config.yaml"
      - "*/rootfs/**"
      - ".github/version-sync.json"
      - "scripts/sync_version_badges.py"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: version-badges-sync
  cancel-in-progress: true
jobs:
  sync:
    name: Sync README badges against real versions
    runs-on: ubuntu-24.04
    if: github.actor != 'github-actions[bot]'
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # APP_TOKEN, not GITHUB_TOKEN: the ruleset on main only lets the
          # repository admin push past the required status checks.
          # The sync commit carries [skip ci], so this push starts no workflows.
          token: ${{ secrets.APP_TOKEN }}
          persist-credentials: true
      - name: Run sync script
        id: sync
        run: python3 scripts/sync_version_badges.py
      - name: Commit changes
        if: steps.sync.outputs.changed == 'true'
        env:
          CHANGED_LIST: ${{ steps.sync.outputs.changed_list }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -- '*/README.md'
          git commit -m "chore(docs): sync version badges [skip ci]
          Aktualisierte Add-ons: ${CHANGED_LIST}"
          git push
