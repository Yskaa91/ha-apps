name: GHCR Cleanup

on:
  schedule:
    - cron: '0 3 * * 0'
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  cleanup:
    name: Cleanup ${{ matrix.package }}
    runs-on: ubuntu-24.04
    permissions:
      packages: write  # required to delete GHCR package versions
    strategy:
      fail-fast: false
      matrix:
        package:
          - forgejo-ha-app
          - intiface-ha-app
          - matrix-synapse-ha-app
          - npm-ha-app
          - teamspeak6-ha-app
          - ntfy-ha-app
          - teamspeak6-manager-ha-app
          - searxng-ha-app
          - navidrome-ha-app
          - ntfy-manager-ha-app
          - nextcloud-ha-app
          - unbound-ha-app
          - vaultwarden
    steps:
      - name: Delete old untagged versions
        continue-on-error: true
        uses: actions/delete-package-versions@e5bc658cc4c965c472efe991f8beea3981499c55 # v5
        with:
          package-name: ${{ matrix.package }}
          package-type: container
          min-versions-to-keep: 2
          delete-only-untagged-versions: true
