name: 00 Meta Validate

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: meta-validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repo-shape:
    name: Repository shape and monorepo contract
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate repository and add-on folders
        shell: bash
        run: |
          set -euo pipefail

          test -f repository.yaml

          python3 - <<'PY'
          import json
          import re
          import sys
          from pathlib import Path

          root = Path(".")
          expected = set(json.load(open("addons.json")))

          def scalar(text: str, key: str) -> str:
              m = re.search(rf"(?m)^\s*{re.escape(key)}\s*:\s*['\"]?([^'\"\n#]+)", text)
              return m.group(1).strip() if m else ""

          def list_value(text: str, key: str) -> list[str]:
              m = re.search(rf"(?ms)^\s*{re.escape(key)}\s*:\s*\n((?:\s+-\s+[^\n]+\n?)+)", text)
              if m:
                  return [x.strip().strip("'\"") for x in re.findall(r"(?m)^\s*-\s*([^\n#]+)", m.group(1))]
              one = scalar(text, key)
              if one.startswith("[") and one.endswith("]"):
                  return [x.strip().strip("'\"") for x in one[1:-1].split(",") if x.strip()]
              return [one] if one else []

          repo_text = Path("repository.yaml").read_text(encoding="utf-8")
          for key in ("name", "url", "maintainer"):
              if not scalar(repo_text, key):
                  raise SystemExit(f"repository.yaml missing required key: {key}")

          found = {p.parent.as_posix() for p in root.glob("*/config.yaml") if not p.parent.name.startswith(".")}
          missing = expected - found
          if missing:
              raise SystemExit(f"missing expected add-on folders: {sorted(missing)}")

          extra = found - expected
          if extra:
              print(f"notice: extra config.yaml folders present: {sorted(extra)}")

          for app in sorted(expected):
              cfg = Path(app, "config.yaml")
              dockerfile = Path(app, "Dockerfile")
              if not cfg.is_file():
                  raise SystemExit(f"{cfg} missing")
              if not dockerfile.is_file():
                  raise SystemExit(f"{dockerfile} missing")

              text = cfg.read_text(encoding="utf-8")
              for key in ("name", "version", "slug", "arch", "image", "url"):
                  if not scalar(text, key) and key != "arch":
                      raise SystemExit(f"{cfg}: missing {key}")

              image = scalar(text, "image").strip("'\"")
              if not image.startswith("ghcr.io/pol4rfuchs/"):
                  raise SystemExit(f"{cfg}: image must point to ghcr.io/pol4rfuchs/...")

              url = scalar(text, "url").strip("'\"")
              if url != "https://github.com/pol4rfuchs/ha-apps":
                  raise SystemExit(f"{cfg}: url must be https://github.com/pol4rfuchs/ha-apps")

              arch = list_value(text, "arch")
              if not arch:
                  raise SystemExit(f"{cfg}: arch must be non-empty")
              bad_arch = sorted(set(arch) - {"aarch64", "amd64"})
              if bad_arch:
                  raise SystemExit(f"{cfg}: unsupported arch entries: {bad_arch}")

              if Path(app, "build.yaml").exists():
                  raise SystemExit(f"{app}/build.yaml is deprecated and must not exist")
              if Path(app, "repository.yaml").exists():
                  raise SystemExit(f"{app}/repository.yaml must not exist inside add-on folder")
              if Path(app, "rootfs", "etc", "services.d").exists():
                  raise SystemExit(f"{app}/rootfs/etc/services.d is old s6-v2 layout and must not exist")

          print("Validated monorepo app contract:", ", ".join(sorted(expected)))
          PY


      - name: Validate options/schema consistency
        shell: bash
        run: |
          set -euo pipefail
          pip install pyyaml --quiet --break-system-packages
          python3 - <<'PYINNER'
          import json
          import yaml
          from pathlib import Path

          expected = json.load(open("addons.json", encoding="utf-8"))
          errors = []

          for app in sorted(expected):
              cfg_path = Path(app, "config.yaml")
              if not cfg_path.is_file():
                  continue
              cfg = yaml.safe_load(cfg_path.read_text(encoding="utf-8"))
              if not isinstance(cfg, dict):
                  continue

              options = cfg.get("options")
              schema = cfg.get("schema")

              if options is None and schema is None:
                  continue

              if options is not None and schema is None:
                  errors.append(f"{app}: has options but no schema")
                  continue

              if schema is not None and options is None:
                  errors.append(f"{app}: has schema but no options")
                  continue

              if not isinstance(options, dict) or not isinstance(schema, dict):
                  continue

              opt_keys = set(options.keys())
              sch_keys = set(schema.keys())

              for k in sorted(opt_keys - sch_keys):
                  errors.append(f"{app}: options key '{k}' missing from schema")
              for k in sorted(sch_keys - opt_keys):
                  errors.append(f"{app}: schema key '{k}' missing from options")

          if errors:
              for e in errors:
                  print(f"ERROR: {e}")
              raise SystemExit("options/schema consistency check failed")

          print("options/schema consistency OK for all add-ons")
          PYINNER

      - name: Check for merge conflict markers in Dockerfiles
        shell: bash
        run: |
          set -euo pipefail
          if grep -rn "^<<<<<<< \|^=======$\|^>>>>>>> " --include="Dockerfile" .; then
            echo "ERROR: merge conflict markers found in one or more Dockerfiles." >&2
            exit 1
          fi
          echo "No conflict markers found in Dockerfiles."

      - name: Check for deprecated legacy forge references
        shell: bash
        run: |
          set -euo pipefail
          token_a="code"
          token_b="berg"
          token_c="forge"
          token_d="jo"
          pattern="${token_a}${token_b}[.]org|${token_a}${token_b}[.]page|[.]${token_c}${token_d}"
          allow_marker="forge-check:allow"

          # Collect raw matches (do not fail the step yet; git grep exits 1 on no match)
          raw_matches="$(git grep -n -i -E "${pattern}" -- . ':!.git' ':!.github/workflows/00-meta-validate.yml' ':!.github/workflows/07-update-upstream-candidate.yml' ':!.github/workflows/23-fast-image-watch.yml' ':!.github/workflows/mirror-to-codeberg.yml' ':!wiki/' ':!forgejo/' || true)"

          # Drop lines that carry an explicit, reviewed allow-marker
          # (e.g. a legitimate Forgejo-upstream badge/link that happens to
          # reference codeberg.org). Everything else still fails the check.
          filtered_matches="$(printf '%s\n' "${raw_matches}" | grep -v -F "${allow_marker}" | sed '/^$/d' || true)"

          if [ -n "${filtered_matches}" ]; then
            echo "ERROR: deprecated legacy forge reference found." >&2
            printf '%s\n' "${filtered_matches}" >&2
            exit 1
          fi

          echo "No (unallowed) deprecated legacy forge references found."
