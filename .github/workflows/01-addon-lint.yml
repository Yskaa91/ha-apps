name: 01 Add-on Lint

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: "17 2 * * 0"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prepare:
    name: Read add-on list
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.load-matrix.outputs.matrix }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Load addons.json
        id: load-matrix
        run: |
          {
            echo 'matrix<<EOF'
            python3 -c "import json; print(json.dumps(json.load(open('addons.json'))))"
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"
  lint:
    name: Lint ${{ matrix.addon }}
    needs: prepare
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        addon: ${{ fromJSON(needs.prepare.outputs.matrix) }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Static add-on layout lint
        shell: bash
        run: |
          set -euo pipefail
          # Field-level checks (required keys, image prefix, url, arch validity)
          # live in 00-meta-validate.yml, which runs once for the whole repo.
          # This step stays deliberately narrow: file-layout presence/absence
          # per add-on, so a broken add-on shows up directly in the matrix.
          addon="${{ matrix.addon }}"
          test -d "$addon"
          test -f "$addon/config.yaml"
          test -f "$addon/Dockerfile"
          test ! -f "$addon/build.yaml"
          test ! -f "$addon/repository.yaml"
          test ! -d "$addon/rootfs/etc/services.d"
          echo "${addon}: layout OK"

      - name: Run add-on shell tests
        shell: bash
        run: |
          set -euo pipefail
          addon="${{ matrix.addon }}"
          # Cheap, hermetic checks that ship next to the add-on (e.g.
          # matrix_synapse/tests/download-urls.sh — resolves the webapp
          # download URLs without bashio or a container).
          shopt -s nullglob
          tests=("$addon"/tests/*.sh)
          if [ "${#tests[@]}" -eq 0 ]; then
            echo "${addon}: no shell tests"
            exit 0
          fi
          for t in "${tests[@]}"; do
            echo "::group::bash ${t}"
            bash "$t"
            echo "::endgroup::"
          done
          echo "${addon}: ${#tests[@]} shell test file(s) passed"

      # The upstream linter is a Docker container action. GitHub builds that
      # image in a pre-step *before* any job step runs, so a Docker Hub
      # timeout/429 fails the whole job and step-level continue-on-error cannot
      # catch it. Run the same lint.py (pinned v2.21) directly instead: no Docker
      # Hub pull, and every failure stays inside this advisory step.
      - name: Checkout add-on linter (v2.21)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        continue-on-error: true
        with:
          repository: frenck/action-addon-linter
          ref: b9cfd1bc62ba60d2c4fc96317b5f7ada5923f4a7 # v2.21
          path: .addon-linter
          persist-credentials: false

      - name: Home Assistant add-on linter advisory
        shell: bash
        continue-on-error: true
        env:
          INPUT_PATH: "./${{ matrix.addon }}"
          INPUT_COMMUNITY: "false"
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/addon-linter-venv"
          "$RUNNER_TEMP/addon-linter-venv/bin/pip" install --quiet --no-cache-dir \
            -r .addon-linter/src/requirements.txt
          # lint.py reads its schemas from the container root.
          sudo cp .addon-linter/src/config.schema.json /config.schema.json
          sudo cp .addon-linter/src/build.schema.json /build.schema.json
          "$RUNNER_TEMP/addon-linter-venv/bin/python" .addon-linter/src/lint.py

      - name: Explain advisory mode
        shell: bash
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'MD'
          Home Assistant add-on linter ran in advisory mode.

          Required gate in this workflow is the static monorepo/layout lint above. The upstream linter is kept visible for cleanup work, but it is not allowed to block builds for legacy config defaults that are still accepted by the current add-on setup.
          MD
