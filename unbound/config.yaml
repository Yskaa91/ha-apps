---
name: "Unbound"
description: "Hardened recursive DNS resolver with built-in web UI"
url: "https://github.com/yskaa91/ha-apps"
version: "1.26.1-ha2-pol4r1"
slug: "unbound"
image: "ghcr.io/yskaa91/unbound"
init: false
ingress: true
ingress_port: 2137
panel_icon: "mdi:dns"
arch:
  - amd64
  - aarch64
ports:
  53/tcp: 5053
  53/udp: 5053
ports_description:
  53/tcp: DNS TCP queries
  53/udp: DNS UDP queries
map:
  - addon_config:rw
options:
  log_level: info
schema:
  log_level: list(trace|debug|info|notice|warning|error|fatal)

startup: system
apparmor: false
